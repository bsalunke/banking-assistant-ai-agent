name: Qualys QScanner - Source Code Vulnerability Scan

# Runs on every commit (push) and on pull requests so vulnerabilities
# are caught before code is merged.
on:
  push:
    branches:
      - main
      - develop
      - aiagent-scan
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      qscanner_download_url:
        description: "Full URL to the QScanner archive (tar.gz or zip). Overrides the repo variable QSCANNER_DOWNLOAD_URL."
        required: false
        type: string

permissions:
  contents: read
  # Required so the codeql-action can upload the SARIF report
  # to the GitHub Security > Code scanning alerts tab.
  security-events: write

jobs:
  qscanner-code-scan:
    name: Scan repo source with Qualys QScanner
    runs-on: ubuntu-latest

    env:
      # Configure these separately in the repository:
      #   - secrets.QUALYS_ACCESS_TOKEN    (required, sensitive; NOT exposed at
      #                                     job level — scoped only to the scan
      #                                     step below so earlier/later steps
      #                                     cannot read it from their env)
      #   - vars.QUALYS_GATEWAY_URL        (required; full Qualys CMS CLI gateway
      #                                     URL, e.g.
      #                                     https://gateway.qg4.apps.qualys.com/cms/cli/v1.0
      #                                     — used with `qscanner --gateway-url`
      #                                     for non-standard / custom pods)
      #   - vars.QSCANNER_DOWNLOAD_URL     (archive URL; can be overridden per-run
      #                                     via the workflow_dispatch input)
      #   - vars.QSCANNER_CODE_PATH        (optional; path inside the checkout
      #                                     to scan; defaults to "." = whole repo)
      QUALYS_GATEWAY_URL: ${{ vars.QUALYS_GATEWAY_URL }}
      QSCANNER_DOWNLOAD_URL: ${{ github.event.inputs.qscanner_download_url || vars.QSCANNER_DOWNLOAD_URL }}
      QSCANNER_CODE_PATH: ${{ vars.QSCANNER_CODE_PATH || '.' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Download the QScanner archive from the URL provided as a workflow
      # input or repo variable, then extract the binary.
      #
      # Pattern based on the Qualys GitHub integration docs:
      #   https://docs.qualys.com/en/qscanner/latest/qscanner_usage/integration_with_github.htm
      #   https://docs.qualys.com/en/qscanner/latest/assets/images/images/sarif_upload_github.png
      - name: Download & extract Qualys QScanner
        # NOTE: shell trace (`set -x`) is intentionally NOT enabled — it would
        # cause command expansions (including env var values) to be echoed to
        # the log. Keep `set -euo pipefail` only.
        run: |
          set -euo pipefail

          if [ -z "${QSCANNER_DOWNLOAD_URL:-}" ]; then
            echo "::error::QSCANNER_DOWNLOAD_URL is empty. Set repo variable QSCANNER_DOWNLOAD_URL or pass the workflow_dispatch input 'qscanner_download_url'."
            exit 1
          fi

          # Echo only the scheme+host so any signed query string in the URL
          # (e.g. presigned S3 URL) does NOT appear in the build log.
          sanitized_host=$(printf '%s' "${QSCANNER_DOWNLOAD_URL}" | awk -F/ '{print $1"//"$3}')
          echo "Downloading QScanner archive from host: ${sanitized_host}"

          archive="qscanner-archive"

          # Pull the archive with retries for transient network errors
          curl -fSL --retry 3 --retry-delay 5 \
               -o "${archive}" \
               "${QSCANNER_DOWNLOAD_URL}"

          # Detect archive type by file signature and extract accordingly.
          # IMPORTANT: extract directly into the current workspace (no
          # qscanner-bin subfolder) because the tarball ships multiple
          # sibling binaries that qscanner expects to find next to itself.
          file_type=$(file -b --mime-type "${archive}" || echo "unknown")
          echo "Detected archive type: ${file_type}"
          case "${file_type}" in
            application/gzip|application/x-gzip|application/x-tar)
              tar -xzvf "${archive}"
              ;;
            application/zip)
              unzip -o "${archive}"
              ;;
            *)
              # Fallback: try tar.gz first, then zip, then treat as raw binary
              if tar -xzvf "${archive}" 2>/dev/null; then
                :
              elif unzip -o "${archive}" 2>/dev/null; then
                :
              else
                echo "Archive format not recognized; treating download as raw binary."
                mv "${archive}" qscanner
              fi
              ;;
          esac
          rm -f "${archive}"

          # Locate the extracted qscanner binary anywhere in the workspace
          # (it may land at the top level or inside a top-level directory
          # created by the tarball, e.g. ./qscanner-4.8.0-3/qscanner).
          QSCANNER_BIN=$(find . -maxdepth 4 -type f -name 'qscanner' \
                          -not -path './.git/*' | head -n1)
          if [ -z "${QSCANNER_BIN}" ]; then
            echo "::error::qscanner binary not found after extraction"
            find . -maxdepth 3 -type f -not -path './.git/*' | head -50
            exit 1
          fi

          # Resolve the directory that contains qscanner and the sibling
          # binary it needs. All files in that directory are made
          # executable, and the directory is added to PATH so qscanner can
          # locate its sibling by name.
          QSCANNER_DIR=$(cd "$(dirname "${QSCANNER_BIN}")" && pwd)
          QSCANNER_BIN="${QSCANNER_DIR}/$(basename "${QSCANNER_BIN}")"
          echo "qscanner binary: ${QSCANNER_BIN}"
          echo "qscanner directory (added to PATH): ${QSCANNER_DIR}"

          find "${QSCANNER_DIR}" -maxdepth 1 -type f -exec chmod +x {} +
          ls -la "${QSCANNER_DIR}"

          # Export both the full binary path and its directory so later
          # steps can reference either, and prepend the directory to PATH.
          echo "QSCANNER_BIN=${QSCANNER_BIN}" >> "${GITHUB_ENV}"
          echo "QSCANNER_DIR=${QSCANNER_DIR}" >> "${GITHUB_ENV}"
          echo "${QSCANNER_DIR}" >> "${GITHUB_PATH}"

          "${QSCANNER_BIN}" --help | head -n 20 || true

      # Scan the checked-out source tree and emit a SARIF report.
      # Uses the `code` subcommand (not `image`) to scan the repo in place
      # rather than a built container image. Uses --gateway-url instead of
      # --pod so non-standard / custom Qualys platforms (e.g. qg4) can be
      # targeted. Docs:
      #   https://docs.qualys.com/en/qscanner/latest/qscanner_usage/qscanner_commands.htm
      #
      # The Qualys access token is scoped to THIS step only — it is not in the
      # job-level env, so no other step (checkout, download, upload) has it
      # available. Shell tracing is intentionally not enabled.
      - name: Run QScanner code scan
        env:
          QUALYS_ACCESS_TOKEN: ${{ secrets.QUALYS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # Belt-and-suspenders: explicitly tell the runner to mask the token
          # in all log output for this step. GitHub already auto-masks values
          # that come from the `secrets` context, but this guarantees masking
          # applies even if the token is transformed or re-emitted by qscanner.
          echo "::add-mask::${QUALYS_ACCESS_TOKEN}"

          if [ -z "${QUALYS_ACCESS_TOKEN:-}" ]; then
            echo "::error::QUALYS_ACCESS_TOKEN secret is not set in the repository."
            exit 1
          fi
          if [ -z "${QUALYS_GATEWAY_URL:-}" ]; then
            echo "::error::QUALYS_GATEWAY_URL repo variable is not set."
            exit 1
          fi

          # qscanner writes its report files into the directory given by
          # --output-dir (there is no --report-file-path flag). We run the
          # scan, then locate the generated SARIF file and copy it to a
          # canonical path that the upload steps reference.
          mkdir -p qscanner-output

          echo "Scanning code path: ${QSCANNER_CODE_PATH}"
          "${QSCANNER_BIN}" \
            --gateway-url "${QUALYS_GATEWAY_URL}" \
            --access-token "${QUALYS_ACCESS_TOKEN}" \
            --output-dir qscanner-output \
            --report-format sarif \
            --scan-types pkg,compliance,aiagent \
            code "${QSCANNER_CODE_PATH}"

          # Find the generated SARIF file and copy it to the canonical path
          # qscanner-report.sarif used by the upload steps.
          #
          # qscanner writes the SARIF report as "<digest>-Report.sarif.json"
          # (a .sarif.json double extension), so we match both *.sarif and
          # *.sarif.json to be robust across qscanner versions. We prefer the
          # file whose name contains "Report" if there are multiple hits.
          sarif_path=$(find qscanner-output -type f \
                        \( -name '*.sarif' -o -name '*.sarif.json' \) \
                        | grep -i 'report' | head -n1 || true)
          if [ -z "${sarif_path}" ]; then
            # Fallback: first SARIF-looking file regardless of naming
            sarif_path=$(find qscanner-output -type f \
                          \( -name '*.sarif' -o -name '*.sarif.json' \) \
                          | head -n1 || true)
          fi
          if [ -z "${sarif_path}" ]; then
            echo "::error::qscanner did not produce a .sarif or .sarif.json file in qscanner-output/"
            ls -R qscanner-output || true
            exit 1
          fi
          cp "${sarif_path}" qscanner-report.sarif
          echo "SARIF report staged at qscanner-report.sarif (source: ${sarif_path})"

      # Persist the SARIF report for later review / audit.
      # Note: only the .sarif output is uploaded — the upload path is
      # deliberately narrow so no unexpected files (env dumps, tmp data)
      # can accidentally be published as build artifacts.
      - name: Upload QScanner SARIF as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qscanner-report-${{ github.sha }}
          path: qscanner-report.sarif
          if-no-files-found: warn
          retention-days: 30

      # Publish SARIF results to GitHub's Security tab.
      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: qscanner-report.sarif
          category: qualys-qscanner
